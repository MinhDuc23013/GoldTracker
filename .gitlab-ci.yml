
stages:
  - build
  - test
  - docker

variables:
  SOLUTION_FILE: "GoldTracker.sln"
  BUILD_CONFIGURATION: "Release"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# Cache NuGet để giảm thời gian Restore
cache:
  key: "nuget-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

# =========================
# STAGE 1: BUILD
# =========================
build-job:
  stage: build

  image: mcr.microsoft.com/dotnet/sdk:8.0

  tags:
    - docker-gold-track

  script:
    - dotnet --info
    - dotnet restore "$SOLUTION_FILE"
    - dotnet build "$SOLUTION_FILE" --configuration $BUILD_CONFIGURATION --no-restore

  # Chuyển kết quả build sang Job Test
  artifacts:
    paths:
      - "**/bin/Release/"
      - "**/obj/Release/"
    expire_in: 1 hour

# =========================
# STAGE 2: UNIT TEST
# =========================
unit-test-job:
  stage: test

  image: mcr.microsoft.com/dotnet/sdk:8.0

  tags:
    - docker-gold-track

  needs:
    - job: build-job
      artifacts: true

  script:
    - dotnet test "$SOLUTION_FILE" --configuration $BUILD_CONFIGURATION --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

  artifacts:
    when: always
    paths:
      - "**/TestResults/*.trx"
    expire_in: 1 week

# =========================
# STAGE 3: BUILD & PUSH DOCKER IMAGE
# =========================
docker-build-job:
  stage: docker

  image: docker:27

  tags:
    - docker-gold-track

  needs:
    - job: unit-test-job

  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|uat|prod|main)$/'

  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/goldtracker-host"

  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f GoldTrackerHost/Dockerfile -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
